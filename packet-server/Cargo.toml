[package]
name = "phantom-server"
version.workspace = true
edition.workspace = true

[dependencies]
phantom-proto = { path = "../packet-proto" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
# QUIC server (UDP/443) — the escape path that survives Iran's TCP-handshake
# RST filter. quinn ships with rustls; we generate a self-signed cert on
# boot since the inner phantom protocol authenticates separately.
quinn = { version = "0.11", default-features = false, features = ["ring", "rustls", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = "1"
