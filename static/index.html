<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>استودیو معماری آرتین | به زودی</title>
    <meta name="description" content="طراحی داخلی مینیمال و معماری مدرن. به زودی.">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #0a0b0e;
            --surface: #14161c;
            --text-main: #e2e4e9;
            --text-muted: #8b8e98;
            --accent: #d4af37;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: radial-gradient(circle at 50% 0%, #1a1c23 0%, transparent 50%);
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }
        h1 span { color: var(--accent); }
        p {
            font-size: 1.2em;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .waitlist-form {
            display: flex;
            gap: 10px;
            max-width: 450px;
            margin: 0 auto;
            position: relative;
        }
        input[type="email"] {
            flex: 1;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus { border-color: var(--accent); }
        button {
            padding: 16px 30px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .footer {
            margin-top: 60px;
            font-size: 0.85em;
            color: #555;
        }
        @media (max-width: 500px) {
            .waitlist-form { flex-direction: column; }
            h1 { font-size: 2.8em; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>استودیو <span>آرتین</span></h1>
    <p>ما در حال خلق تجربه‌ای متفاوت از طراحی مینیمال و معماری لوکس هستیم. برای دریافت دعوت‌نامه اختصاصی، در لیست انتظار ثبت‌نام کنید.</p>
    
    <div class="waitlist-form">
        <input type="email" placeholder="آدرس ایمیل خود را وارد کنید..." required>
        <button type="button" onclick="alert('شما با موفقیت به لیست انتظار اضافه شدید.')">ثبت‌نام</button>
    </div>

    <div class="footer">
        &copy; ۱۴۰۳ استودیو معماری آرتین. به زودی.
    </div>
</div>

</body>
</html>
