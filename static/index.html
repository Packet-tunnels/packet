<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مسترکلاس پیانو | به زودی</title>
    <meta name="description" content="آموزش تخصصی و حرفه‌ای پیانو. به زودی در این پلتفرم.">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #08090a;
            --surface: #111216;
            --text-main: #f0f0f0;
            --text-muted: #7a7d85;
            --accent: #e5b869; /* Soft Gold */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: radial-gradient(circle at 50% 30%, #171920 0%, transparent 60%);
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 700px;
            padding: 40px;
        }
        .icon {
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        h1 {
            font-size: 3.2em;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }
        h1 span { color: var(--accent); font-weight: 800; }
        p {
            font-size: 1.25em;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .coming-soon {
            display: inline-block;
            padding: 10px 30px;
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: var(--accent);
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.85em;
            color: #444;
        }
        @media (max-width: 500px) {
            h1 { font-size: 2.5em; }
            p { font-size: 1.1em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🎹</div>
    <h1>مسترکلاس <span>پیانو</span></h1>
    <p>تجربه‌ای نوین در آموزش حرفه‌ای پیانو و درک موسیقی کلاسیک. پلتفرم آموزشی ما در حال آماده‌سازی است.</p>
    
    <div class="coming-soon">به زودی ...</div>
</div>

<div class="footer">
    &copy; ۱۴۰۳ پلتفرم آموزش پیانو. تمامی حقوق محفوظ است.
</div>

</body>
</html>
